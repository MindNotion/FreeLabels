name: Build Installers

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build jar
        run: mvn -B package

      # ---- Linux ----
      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: Build Linux installer
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x packaging/linux/build-installer.sh
          ./packaging/linux/build-installer.sh

      # ---- Windows ----      
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          set PATH=%PATH%;C:\Program Files (x86)\WiX Toolset v3.14\bin
          packaging\windows\build-installer.bat

      # ---- macOS ----
      - name: Build macOS installer
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x packaging/macos/build-installer.sh
          ./packaging/macos/build-installer.sh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: freelabels-installer-${{ matrix.name }}
          path: target/installer/*
          if-no-files-found: error
          retention-days: 30
